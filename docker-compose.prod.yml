# =============================================================================
# NAWWAR — Production Hardening Overrides
# =============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Hardens containers with `no-new-privileges`, read-only root filesystems where
# supported, explicit tmpfs mounts, and internal-only backend networking.
# =============================================================================

services:
  db:
    restart: always
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /run/postgresql:size=16M,mode=2775,uid=70,gid=70

  api:
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
      - /var/cache/nginx:size=32M,mode=0755,uid=101,gid=101
      - /var/run:size=8M,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  storage:
    restart: always
    security_opt:
      - no-new-privileges:true

networks:
  backend_net:
    internal: true

